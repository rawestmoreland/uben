<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <!-- Only this origin's script and API; nothing else can run or be called. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Reset your password - Üben</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px;
        background: #fff8e1;
        color: #000;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 440px;
        margin: 0 auto;
        background: #fff;
        border: 3px solid #000;
        box-shadow: 6px 6px 0 #000;
        padding: 24px;
      }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0.5px; }
      p { line-height: 1.5; margin: 0 0 16px; }
      label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
      input {
        width: 100%;
        min-height: 48px;
        padding: 0 12px;
        margin-bottom: 16px;
        border: 3px solid #000;
        border-radius: 0;
        background: #fff;
        font: inherit;
        font-weight: 600;
      }
      input:focus { outline: 3px solid #0066ff; outline-offset: 0; }
      button {
        width: 100%;
        min-height: 52px;
        border: 3px solid #000;
        border-radius: 0;
        background: #ffe500;
        color: #000;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 4px 4px 0 #000;
      }
      button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
      button:disabled { opacity: 0.5; cursor: default; }
      #message { padding: 12px; border: 3px solid #000; font-weight: 700; margin-bottom: 16px; }
      #message.error { background: #ff3333; }
      #message.success { background: #00cc66; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Üben</h1>
      <p id="intro">Choose a new password for your cloud backup account.</p>
      <div id="message" role="alert" hidden></div>
      <form id="form" novalidate>
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="confirm">Repeat new password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
        <button id="submit" type="submit">Change password</button>
      </form>
    </main>
    <script src="reset-password.js"></script>
  </body>
</html>
