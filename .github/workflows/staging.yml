name: Staging - OTA or Preview Builds

on:
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version
        id: bump
        run: |
          node scripts/bump-version.js staging

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json package.json
          git commit -m "chore: bump version to $(cat app.json | grep -o '"version": "[^"]*' | cut -d'"' -f4) [skip ci]"
          git push

  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: bump-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  deploy:
    name: OTA Update or Build
    runs-on: ubuntu-latest
    needs: [bump-version, lint-and-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check for native changes
        id: fingerprint
        run: |
          # Generate current native fingerprints
          CURRENT_IOS=$(npx expo-updates fingerprint:generate --platform ios 2>/dev/null | jq -r '.hash')
          CURRENT_ANDROID=$(npx expo-updates fingerprint:generate --platform android 2>/dev/null | jq -r '.hash')
          echo "Current iOS fingerprint: $CURRENT_IOS"
          echo "Current Android fingerprint: $CURRENT_ANDROID"

          # Get latest finished staging build runtime versions
          LATEST_IOS_RV=$(eas build:list --channel staging --platform ios --status finished --limit 1 --non-interactive --json 2>/dev/null | jq -r '.[0].runtimeVersion // empty')
          LATEST_ANDROID_RV=$(eas build:list --channel staging --platform android --status finished --limit 1 --non-interactive --json 2>/dev/null | jq -r '.[0].runtimeVersion // empty')
          echo "Latest iOS build runtime version: $LATEST_IOS_RV"
          echo "Latest Android build runtime version: $LATEST_ANDROID_RV"

          # Compare fingerprints - OTA is only viable if both platforms match
          if [ -n "$LATEST_IOS_RV" ] && [ -n "$LATEST_ANDROID_RV" ] && [ "$CURRENT_IOS" = "$LATEST_IOS_RV" ] && [ "$CURRENT_ANDROID" = "$LATEST_ANDROID_RV" ]; then
            echo "✅ Fingerprints match existing builds - OTA update possible"
            echo "deploy_type=ota" >> $GITHUB_OUTPUT
          else
            echo "🔨 Fingerprints differ or no existing builds - full build required"
            echo "deploy_type=build" >> $GITHUB_OUTPUT
          fi

      - name: Publish OTA update
        if: steps.fingerprint.outputs.deploy_type == 'ota'
        run: |
          echo "📡 Publishing OTA update to staging channel..."
          eas update --branch staging --message "Staging OTA update" --non-interactive --platform all

      - name: Build and submit iOS
        if: steps.fingerprint.outputs.deploy_type == 'build'
        run: |
          eas build --profile preview-store --platform ios --non-interactive --auto-submit --no-wait

      - name: Build and submit Android
        if: steps.fingerprint.outputs.deploy_type == 'build'
        run: |
          eas build --profile preview-store --platform android --non-interactive --auto-submit --no-wait

      - name: Create pre-release tag
        run: |
          VERSION=$(cat app.json | grep -o '"version": "[^"]*' | cut -d'"' -f4)
          DEPLOY_TYPE="${{ steps.fingerprint.outputs.deploy_type }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}-staging" -m "Staging release v${VERSION} (${DEPLOY_TYPE})"
          git push origin "v${VERSION}-staging"

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const deployType = '${{ steps.fingerprint.outputs.deploy_type }}';
            const body = deployType === 'ota'
              ? '📡 **OTA update published to staging**\n\nJS-only changes detected. Testers with existing builds will receive the update automatically.'
              : '🔨 **Native build triggered for staging**\n\nNative changes detected. Full build submitted to TestFlight/internal testing track.';
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });
