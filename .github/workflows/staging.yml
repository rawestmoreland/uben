name: Staging - OTA or Preview Builds

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, e.g. "ios", "android" or "ios,android". Blank = BUILD_PLATFORMS repo variable (default ios)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  config:
    name: Resolve Platforms
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.resolve.outputs.ios }}
      android: ${{ steps.resolve.outputs.android }}
      eas_platform: ${{ steps.resolve.outputs.eas_platform }}
    steps:
      - name: Resolve platforms
        id: resolve
        env:
          RAW: ${{ inputs.platforms || vars.BUILD_PLATFORMS || 'ios' }}
        run: |
          IOS=false; ANDROID=false
          case "$RAW" in *ios*) IOS=true ;; esac
          case "$RAW" in *android*) ANDROID=true ;; esac
          if [ "$IOS" = false ] && [ "$ANDROID" = false ]; then
            echo "::error::No valid platform in '$RAW'. Use ios, android, or both."
            exit 1
          fi
          if [ "$IOS" = true ] && [ "$ANDROID" = true ]; then PLATFORM=all
          elif [ "$IOS" = true ]; then PLATFORM=ios
          else PLATFORM=android; fi
          echo "Platforms: $RAW -> ios=$IOS android=$ANDROID"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "eas_platform=$PLATFORM" >> "$GITHUB_OUTPUT"

  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  deploy:
    name: OTA Update or Build
    runs-on: ubuntu-latest
    needs: [config, lint-and-check]
    env:
      BUILD_IOS: ${{ needs.config.outputs.ios }}
      BUILD_ANDROID: ${{ needs.config.outputs.android }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check for native changes
        id: fingerprint
        run: |
          # Only platforms selected for this run are compared; skipped platforms
          # would otherwise drift and force a full build on every push.
          OTA_PLATFORMS=""
          BUILD_PLATFORMS=""

          # Print the fingerprint hash from `eas fingerprint:generate --json`. eas-cli can
          # write status lines (e.g. "Environment variables ... loaded from ...") to stdout
          # ahead of the JSON when run in CI, which breaks a plain `jq`. Keep everything
          # from the first line that starts the JSON document, and show the raw output if
          # no hash can be read so the real cause is visible in the log.
          fingerprint_hash() {
            local raw hash
            raw=$("$@") || true
            hash=$(printf '%s\n' "$raw" | sed -n '/^[[{]/,$p' | jq -r '.hash // empty' 2>/dev/null) || hash=""
            if [ -z "$hash" ]; then
              echo "::warning::could not read a fingerprint hash from: $*. Output: $raw" >&2
            fi
            printf '%s' "$hash"
          }

          for PLATFORM in ios android; do
            if [ "$PLATFORM" = ios ]; then SELECTED=$BUILD_IOS; else SELECTED=$BUILD_ANDROID; fi
            [ "$SELECTED" = true ] || continue

            # Generate the fingerprint with eas-cli, not `expo-updates fingerprint:generate`:
            # eas-cli resolves the same build profile env and EAS "preview" environment
            # variables the builder uses, which feed into app.config.js. A bare local
            # run produced a different hash than the builder, so it never matched.
            # stderr is left visible so failures show up in the log.
            CURRENT=$(fingerprint_hash eas fingerprint:generate --build-profile preview --platform "$PLATFORM" --json --non-interactive)

            # `eas update` doesn't apply the preview profile's `env` block, but it does load
            # the server-side EAS "preview" environment via `--environment`. APP_ENV (which
            # changes the app name, bundle id and scheme) must be defined there, or the update
            # would get a different runtime version than the preview builds. Check with the same
            # flag the publish step uses, and bail out to a full build if the hashes differ.
            UPDATE_FP=$(fingerprint_hash eas fingerprint:generate --environment preview --platform "$PLATFORM" --json --non-interactive)
            if [ "$UPDATE_FP" != "$CURRENT" ]; then
              echo "::warning::$PLATFORM: an update would get runtime version ${UPDATE_FP:-<failed>}, not ${CURRENT:-<failed>}; falling back to a full build."
              CURRENT=""
            fi

            # Ask EAS for a finished preview-channel build with exactly this runtime version.
            # Preview builds live on the "preview" channel, which the "staging" EAS branch feeds.
            MATCHING_BUILDS=0
            if [ -n "$CURRENT" ]; then
              # Capture stdout separately so a failed lookup shows eas-cli's real error
              # instead of a confusing jq parse error.
              if BUILDS=$(eas build:list --channel preview --platform "$PLATFORM" --status finished --runtime-version "$CURRENT" --limit 1 --non-interactive --json); then
                MATCHING_BUILDS=$(echo "$BUILDS" | jq 'length') || MATCHING_BUILDS=0
              else
                echo "::warning::eas build:list failed for $PLATFORM; treating as no matching build. Output: $BUILDS"
              fi
            fi
            echo "$PLATFORM fingerprint: ${CURRENT:-<failed to generate>} (finished preview builds with this runtime version: $MATCHING_BUILDS)"

            # Decide per platform: a platform with a matching build gets an OTA update,
            # one without gets a new build. One platform needing a build must not force
            # a build (or block the OTA) on the other.
            if [ "$MATCHING_BUILDS" -ge 1 ]; then
              echo "✅ $PLATFORM: fingerprint matches an existing build - OTA update"
              OTA_PLATFORMS="$OTA_PLATFORMS $PLATFORM"
            else
              echo "🔨 $PLATFORM: fingerprint differs or no existing build - full build required"
              BUILD_PLATFORMS="$BUILD_PLATFORMS $PLATFORM"
            fi
          done

          OTA_PLATFORMS=$(echo $OTA_PLATFORMS)
          BUILD_PLATFORMS=$(echo $BUILD_PLATFORMS)
          echo "OTA platforms: ${OTA_PLATFORMS:-<none>}; build platforms: ${BUILD_PLATFORMS:-<none>}"

          has_platform() { case " $1 " in *" $2 "*) echo true ;; *) echo false ;; esac; }
          echo "ota_ios=$(has_platform "$OTA_PLATFORMS" ios)" >> $GITHUB_OUTPUT
          echo "ota_android=$(has_platform "$OTA_PLATFORMS" android)" >> $GITHUB_OUTPUT
          echo "build_ios=$(has_platform "$BUILD_PLATFORMS" ios)" >> $GITHUB_OUTPUT
          echo "build_android=$(has_platform "$BUILD_PLATFORMS" android)" >> $GITHUB_OUTPUT
          echo "ota_platforms=$OTA_PLATFORMS" >> $GITHUB_OUTPUT
          echo "build_platforms=$BUILD_PLATFORMS" >> $GITHUB_OUTPUT

      - name: Publish OTA update
        id: ota
        if: steps.fingerprint.outputs.ota_platforms != ''
        env:
          OTA_IOS: ${{ steps.fingerprint.outputs.ota_ios }}
          OTA_ANDROID: ${{ steps.fingerprint.outputs.ota_android }}
        run: |
          echo "📡 Publishing OTA update to the staging branch (preview channel)..."
          # Publish each platform with a matching build separately: `--platform all`
          # also exports a web bundle, which this native-only app can't build.
          GROUP_IDS=()
          for PLATFORM in ios android; do
            if [ "$PLATFORM" = ios ] && [ "$OTA_IOS" != true ]; then continue; fi
            if [ "$PLATFORM" = android ] && [ "$OTA_ANDROID" != true ]; then continue; fi
            OUTPUT=$(eas update --branch staging --environment preview --message "Staging OTA update (${GITHUB_SHA::7})" --non-interactive --platform "$PLATFORM" --json)
            echo "$OUTPUT"
            GROUP_IDS+=("$(echo "$OUTPUT" | jq -r '.[0].group')")
          done
          # Record the update group(s) so the git tag maps to the exact update
          echo "group_id=$(IFS=,; echo "${GROUP_IDS[*]}")" >> $GITHUB_OUTPUT

      - name: Build iOS (internal)
        if: steps.fingerprint.outputs.build_ios == 'true'
        run: |
          eas build --profile preview --platform ios --non-interactive --no-wait

      - name: Build Android (internal)
        if: steps.fingerprint.outputs.build_android == 'true'
        run: |
          eas build --profile preview --platform android --non-interactive --no-wait

      - name: Create pre-release tag
        env:
          OTA_PLATFORMS: ${{ steps.fingerprint.outputs.ota_platforms }}
          BUILD_PLATFORMS: ${{ steps.fingerprint.outputs.build_platforms }}
          UPDATE_GROUP_ID: ${{ steps.ota.outputs.group_id }}
        run: |
          VERSION=$(node scripts/app-version.cjs)
          # Unique per run: the app version doesn't change between staging OTAs, so a fixed tag would collide
          TAG="v${VERSION}-staging.${GITHUB_RUN_NUMBER}"
          MESSAGE="Staging for v${VERSION}:"
          [ -n "$OTA_PLATFORMS" ] && MESSAGE="${MESSAGE} OTA (${OTA_PLATFORMS})"
          [ -n "$BUILD_PLATFORMS" ] && MESSAGE="${MESSAGE} build (${BUILD_PLATFORMS})"
          if [ -n "$UPDATE_GROUP_ID" ]; then
            MESSAGE="${MESSAGE} (EAS update group(s) ${UPDATE_GROUP_ID})"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$MESSAGE"
          git push origin "$TAG"

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const otaPlatforms = '${{ steps.fingerprint.outputs.ota_platforms }}';
            const buildPlatforms = '${{ steps.fingerprint.outputs.build_platforms }}';
            const sections = [];
            if (otaPlatforms) {
              sections.push(`📡 **OTA update published to staging** (${otaPlatforms})\n\nNo native changes on these platforms. Testers with existing builds will receive the update automatically.`);
            }
            if (buildPlatforms) {
              sections.push(`🔨 **Native build triggered for staging** (${buildPlatforms})\n\nNative changes or no matching build on these platforms. Internal distribution build started on EAS.`);
            }
            const body = sections.join('\n\n');
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });
