name: Staging - OTA or Preview Builds

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, e.g. "ios", "android" or "ios,android". Blank = BUILD_PLATFORMS repo variable (default ios)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  config:
    name: Resolve Platforms
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.resolve.outputs.ios }}
      android: ${{ steps.resolve.outputs.android }}
      eas_platform: ${{ steps.resolve.outputs.eas_platform }}
    steps:
      - name: Resolve platforms
        id: resolve
        env:
          RAW: ${{ inputs.platforms || vars.BUILD_PLATFORMS || 'ios' }}
        run: |
          IOS=false; ANDROID=false
          case "$RAW" in *ios*) IOS=true ;; esac
          case "$RAW" in *android*) ANDROID=true ;; esac
          if [ "$IOS" = false ] && [ "$ANDROID" = false ]; then
            echo "::error::No valid platform in '$RAW'. Use ios, android, or both."
            exit 1
          fi
          if [ "$IOS" = true ] && [ "$ANDROID" = true ]; then PLATFORM=all
          elif [ "$IOS" = true ]; then PLATFORM=ios
          else PLATFORM=android; fi
          echo "Platforms: $RAW -> ios=$IOS android=$ANDROID"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "eas_platform=$PLATFORM" >> "$GITHUB_OUTPUT"

  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  deploy:
    name: OTA Update or Build
    runs-on: ubuntu-latest
    needs: [config, lint-and-check]
    env:
      BUILD_IOS: ${{ needs.config.outputs.ios }}
      BUILD_ANDROID: ${{ needs.config.outputs.android }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check for native changes
        id: fingerprint
        run: |
          # Only platforms selected for this run are compared; skipped platforms
          # would otherwise drift and force a full build on every push.
          OTA_OK=true
          for PLATFORM in ios android; do
            if [ "$PLATFORM" = ios ]; then SELECTED=$BUILD_IOS; else SELECTED=$BUILD_ANDROID; fi
            [ "$SELECTED" = true ] || continue

            CURRENT=$(npx expo-updates fingerprint:generate --platform "$PLATFORM" 2>/dev/null | jq -r '.hash')
            LATEST_RV=$(eas build:list --channel staging --platform "$PLATFORM" --status finished --limit 1 --non-interactive --json 2>/dev/null | jq -r '.[0].runtimeVersion // empty')
            echo "$PLATFORM fingerprint: $CURRENT (latest build runtime version: $LATEST_RV)"

            if [ -z "$LATEST_RV" ] || [ "$CURRENT" != "$LATEST_RV" ]; then
              OTA_OK=false
            fi
          done

          # OTA is only viable if every selected platform matches its existing build
          if [ "$OTA_OK" = true ]; then
            echo "✅ Fingerprints match existing builds - OTA update possible"
            echo "deploy_type=ota" >> $GITHUB_OUTPUT
          else
            echo "🔨 Fingerprints differ or no existing builds - full build required"
            echo "deploy_type=build" >> $GITHUB_OUTPUT
          fi

      - name: Publish OTA update
        id: ota
        if: steps.fingerprint.outputs.deploy_type == 'ota'
        env:
          EAS_PLATFORM: ${{ needs.config.outputs.eas_platform }}
        run: |
          echo "📡 Publishing OTA update to staging channel..."
          OUTPUT=$(eas update --branch staging --message "Staging OTA update (${GITHUB_SHA::7})" --non-interactive --platform "$EAS_PLATFORM" --json)
          echo "$OUTPUT"
          # Selected platforms share one update group; record it so the git tag maps to the exact update
          GROUP_ID=$(echo "$OUTPUT" | jq -r '.[0].group')
          echo "group_id=$GROUP_ID" >> $GITHUB_OUTPUT

      - name: Build iOS (internal)
        if: steps.fingerprint.outputs.deploy_type == 'build' && needs.config.outputs.ios == 'true'
        run: |
          eas build --profile preview --platform ios --non-interactive --no-wait

      - name: Build Android (internal)
        if: steps.fingerprint.outputs.deploy_type == 'build' && needs.config.outputs.android == 'true'
        run: |
          eas build --profile preview --platform android --non-interactive --no-wait

      - name: Create pre-release tag
        env:
          DEPLOY_TYPE: ${{ steps.fingerprint.outputs.deploy_type }}
          UPDATE_GROUP_ID: ${{ steps.ota.outputs.group_id }}
        run: |
          VERSION=$(node scripts/app-version.cjs)
          # Unique per run: the app version doesn't change between staging OTAs, so a fixed tag would collide
          TAG="v${VERSION}-staging.${GITHUB_RUN_NUMBER}"
          MESSAGE="Staging ${DEPLOY_TYPE} for v${VERSION}"
          if [ -n "$UPDATE_GROUP_ID" ]; then
            MESSAGE="${MESSAGE} (EAS update group ${UPDATE_GROUP_ID})"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$MESSAGE"
          git push origin "$TAG"

      - name: Comment on commit
        uses: actions/github-script@v7
        with:
          script: |
            const deployType = '${{ steps.fingerprint.outputs.deploy_type }}';
            const body = deployType === 'ota'
              ? '📡 **OTA update published to staging**\n\nJS-only changes detected. Testers with existing builds will receive the update automatically.'
              : '🔨 **Native build triggered for staging**\n\nNative changes detected. Internal distribution build started on EAS.';
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body
            });
