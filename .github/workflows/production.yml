name: Production - App Store Release

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate version
        run: |
          VERSION=$(cat app.json | grep -o '"version": "[^"]*' | cut -d'"' -f4)
          echo "✅ Production release version: $VERSION"

  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  build-and-submit:
    name: Build and Submit to App Store
    runs-on: ubuntu-latest
    needs: [validate, lint-and-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and submit iOS
        run: |
          npx eas build --profile production --platform ios --non-interactive --auto-submit --no-wait

      - name: Build and submit Android
        run: |
          npx eas build --profile production --platform android --non-interactive --auto-submit --no-wait

      - name: Create production release tag
        run: |
          VERSION=$(cat app.json | grep -o '"version": "[^"]*' | cut -d'"' -f4)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Production release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=$(cat app.json | grep -o '"version": "[^"]*' | cut -d'"' -f4)
          echo "## Version $VERSION" > CHANGELOG.txt
          echo "" >> CHANGELOG.txt
          git log --pretty=format:"- %s (%h)" HEAD~10..HEAD >> CHANGELOG.txt

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.txt', 'utf8');
            const version = JSON.parse(fs.readFileSync('app.json')).expo.version;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `v${version}`,
              body: changelog,
              draft: false,
              prerelease: false
            });
