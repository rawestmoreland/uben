name: Production - App Store Release

# Full store release. Push a semver tag (v1.9.1) from a commit on main.
# OTA updates live in production-ota.yml.
on:
  push:
    tags:
      # Exact semver only. Does not match v1.9.1-staging.4 or v1.9.1-ota.2
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual run: run from main (the tag is derived from the app version and created
  # on release) or from an existing semver tag.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to release, e.g. "ios", "android" or "ios,android". Blank = BUILD_PLATFORMS repo variable (default ios)'
        required: false
        default: ''

permissions:
  contents: write

# Never run two store releases at once, and never cancel one halfway through
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  config:
    name: Resolve Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve platforms
        id: resolve
        env:
          RAW: ${{ inputs.platforms || vars.BUILD_PLATFORMS || 'ios' }}
        run: |
          PLATFORMS=()
          case "$RAW" in *ios*) PLATFORMS+=(ios) ;; esac
          case "$RAW" in *android*) PLATFORMS+=(android) ;; esac
          if [ ${#PLATFORMS[@]} -eq 0 ]; then
            echo "::error::No valid platform in '$RAW'. Use ios, android, or both."
            exit 1
          fi
          MATRIX=$(printf '%s\n' "${PLATFORMS[@]}" | jq -R . | jq -sc .)
          echo "Platforms: $RAW -> $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag matches app version
        id: version
        run: |
          VERSION=$(node scripts/app-version.cjs)
          TAG="v${VERSION}"
          # Only a tag ref has a tag name to compare. A manual run from a branch
          # derives the tag from the app version instead.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.config.js version ${TAG}. Delete the tag, fix the version, and re-tag."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Manual runs must use main or a semver tag as the ref (got $GITHUB_REF_NAME)."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Run from that tag, or bump the version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Check tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Production releases must come from main."
            exit 1
          fi

  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # One job per platform so a failure on one doesn't hide the other.
  # Each job waits for the EAS build to finish, then submits that exact build.
  build-and-submit:
    name: Build and Submit (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [config, validate, lint-and-check]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          OUTPUT=$(eas build --profile production --platform "$PLATFORM" --non-interactive --wait --json)
          echo "$OUTPUT"
          BUILD_ID=$(echo "$OUTPUT" | jq -r '.[0].id')
          STATUS=$(echo "$OUTPUT" | jq -r '.[0].status')
          if [ "$STATUS" != "FINISHED" ]; then
            echo "::error::$PLATFORM build $BUILD_ID ended with status $STATUS"
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Submit
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          eas submit --platform "$PLATFORM" --profile production --id "$BUILD_ID" --non-interactive --wait

  # Only runs if every build and submission succeeded
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-and-submit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate fallback changelog
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          # Previous release = newest exact-semver tag other than this one
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}"
          fi
          {
            echo "## Version ${TAG#v}"
            echo ""
            git log --no-merges --pretty=format:"- %s (%h)" "$RANGE"
          } > CHANGELOG.txt

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = '${{ needs.validate.outputs.tag }}';

            // release-notes.yml may already have drafted this release with Claude-written notes.
            // If so, publish it and keep its body; otherwise fall back to the git log changelog.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const existing = releases.find((release) => release.tag_name === tag);

            if (existing) {
              await github.rest.repos.updateRelease({
                owner, repo, release_id: existing.id, draft: false,
              });
              return;
            }

            await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              target_commitish: context.sha, // creates the tag on manual runs from main
              name: tag,
              body: fs.readFileSync('CHANGELOG.txt', 'utf8'),
              draft: false,
              prerelease: false,
            });
