name: Production - OTA

# Manual OTA (JS-only update) to the production channel. Run it from main.
# Store releases live in production.yml.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to update, e.g. "ios", "android" or "ios,android". Blank = BUILD_PLATFORMS repo variable (default ios)'
        required: false
        default: ''
      message:
        description: 'Update description'
        required: true
        type: string
      skip_build_check:
        description: 'Skip the EAS build lookup (for builds uploaded without runtime metadata)'
        required: false
        default: false
        type: boolean
      issue:
        description: 'Tracking issue number to comment on (optional)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: production-ota
  cancel-in-progress: false

jobs:
  config:
    name: Resolve Platforms
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.resolve.outputs.ios }}
      android: ${{ steps.resolve.outputs.android }}
      eas_platform: ${{ steps.resolve.outputs.eas_platform }}
    steps:
      - name: Resolve platforms
        id: resolve
        env:
          RAW: ${{ inputs.platforms || vars.BUILD_PLATFORMS || 'ios' }}
        run: |
          IOS=false; ANDROID=false
          case "$RAW" in *ios*) IOS=true ;; esac
          case "$RAW" in *android*) ANDROID=true ;; esac
          if [ "$IOS" = false ] && [ "$ANDROID" = false ]; then
            echo "::error::No valid platform in '$RAW'. Use ios, android, or both."
            exit 1
          fi
          if [ "$IOS" = true ] && [ "$ANDROID" = true ]; then PLATFORM=all
          elif [ "$IOS" = true ]; then PLATFORM=ios
          else PLATFORM=android; fi
          echo "Platforms: $RAW -> ios=$IOS android=$ANDROID"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "eas_platform=$PLATFORM" >> "$GITHUB_OUTPUT"

  ota:
    name: Publish OTA
    needs: config
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # An OTA only reaches builds with the same runtime version. This needs
      # runtimeVersion.policy = 'fingerprint' in app.config.js; with 'appVersion' the
      # build's runtime version is "1.9.1", which can never equal a fingerprint hash.
      - name: Verify OTA compatibility
        env:
          SKIP_BUILD_CHECK: ${{ inputs.skip_build_check }}
          IOS: ${{ needs.config.outputs.ios }}
          ANDROID: ${{ needs.config.outputs.android }}
        run: |
          # Generate fingerprints with eas-cli, not `expo-updates fingerprint:generate`: eas-cli
          # resolves the same build profile env and EAS "production" environment variables the
          # builder uses, which feed into app.config.js. A bare local run produces a different
          # hash than the builder, so it would never match the store builds. (staging.yml does
          # the same.) stderr is left visible so failures show up in the log. Only the platforms
          # selected for this run are checked.
          PLATFORMS=()
          if [ "$IOS" = "true" ]; then PLATFORMS+=(ios); fi
          if [ "$ANDROID" = "true" ]; then PLATFORMS+=(android); fi

          declare -A FINGERPRINTS
          for PLATFORM in "${PLATFORMS[@]}"; do
            HASH=$(eas fingerprint:generate --build-profile production --platform "$PLATFORM" --json --non-interactive | jq -r '.hash // empty') || HASH=""
            echo "$PLATFORM fingerprint: $HASH"
            if [ -z "$HASH" ]; then
              echo "::error::Could not generate the $PLATFORM native fingerprint."
              exit 1
            fi
            FINGERPRINTS[$PLATFORM]="$HASH"
          done

          if [ "$SKIP_BUILD_CHECK" = "true" ]; then
            echo "::warning::Skipping the EAS build lookup. Make sure the fingerprints above match the production binaries' runtime versions, or users will not receive this update."
            exit 0
          fi

          # The update is only delivered to builds with the same runtime version, so look for a
          # finished production-channel build with exactly the current fingerprint.
          check_platform() {
            local platform="$1" current="$2" builds
            if ! builds=$(eas build:list --channel production --platform "$platform" --status finished --runtime-version "$current" --limit 1 --non-interactive --json); then
              echo "::error::eas build:list failed for $platform (see output above)."
              return 1
            fi
            if [ "$(echo "$builds" | jq 'length')" -eq 0 ]; then
              echo "::error::No finished $platform build on the production channel has runtime version $current. Either the native fingerprint changed since the last store build (do a full store release), the build was uploaded without channel/runtime metadata (re-run with skip_build_check after confirming the binary's runtime version), or the project is not using runtimeVersion.policy 'fingerprint'."
              return 1
            fi
            echo "$platform: found a finished build with runtime version $current"
          }

          status=0
          for PLATFORM in "${PLATFORMS[@]}"; do
            check_platform "$PLATFORM" "${FINGERPRINTS[$PLATFORM]}" || status=1
          done
          if [ "$status" -ne 0 ]; then exit 1; fi
          echo "Fingerprints match - OTA update is safe to publish"

      - name: Publish OTA update
        id: ota
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
          EAS_PLATFORM: ${{ needs.config.outputs.eas_platform }}
        run: |
          OUTPUT=$(eas update --branch production --message "${UPDATE_MESSAGE} (${GITHUB_SHA::7})" --non-interactive --platform "$EAS_PLATFORM" --json)
          echo "$OUTPUT"
          GROUP_ID=$(echo "$OUTPUT" | jq -r '.[0].group')
          # iOS and Android fingerprints differ, so record both (n/a for a platform that wasn't updated)
          IOS_RV=$(echo "$OUTPUT" | jq -r '[.[] | select(.platform == "ios")][0].runtimeVersion // "n/a"')
          ANDROID_RV=$(echo "$OUTPUT" | jq -r '[.[] | select(.platform == "android")][0].runtimeVersion // "n/a"')
          echo "group_id=$GROUP_ID" >> "$GITHUB_OUTPUT"
          echo "ios_runtime_version=$IOS_RV" >> "$GITHUB_OUTPUT"
          echo "android_runtime_version=$ANDROID_RV" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        uses: actions/github-script@v7
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
          UPDATE_GROUP_ID: ${{ steps.ota.outputs.group_id }}
          IOS_RUNTIME_VERSION: ${{ steps.ota.outputs.ios_runtime_version }}
          ANDROID_RUNTIME_VERSION: ${{ steps.ota.outputs.android_runtime_version }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        with:
          script: |
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;
            const version = execSync('node scripts/app-version.cjs').toString().trim();
            const message = process.env.UPDATE_MESSAGE;
            const groupId = process.env.UPDATE_GROUP_ID;
            const iosRv = process.env.IOS_RUNTIME_VERSION;
            const androidRv = process.env.ANDROID_RUNTIME_VERSION;
            // Short form (first 8 chars) is what goes in the project board's Runtime version field
            const short = (rv) => (rv && rv !== 'n/a' ? rv.slice(0, 8) : rv);
            const dashboardUrl = `https://expo.dev/accounts/rawestmoreland/projects/uben/updates/${groupId}`;

            // Unique per run: the app version doesn't change between OTAs
            const tag = `v${version}-ota.${process.env.GITHUB_RUN_NUMBER}`;

            await github.rest.git.createRef({
              owner, repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `v${version} OTA`,
              body: `## Production OTA\n\n${message}\n\nEAS update group: [\`${groupId}\`](${dashboardUrl})\n\nRuntime version: iOS \`${iosRv}\`, Android \`${androidRv}\`\n\nDelivered over the air. No store update is required.`,
              draft: false,
              prerelease: true,
            });

            // Report back to the tracking issue so the release board reflects the OTA
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issueNumber,
                body: [
                  `OTA published to \`production\` (${tag}).`,
                  '',
                  `- Update group: [\`${groupId}\`](${dashboardUrl})`,
                  `- Runtime version (iOS): \`${short(iosRv)}\` (full: \`${iosRv}\`)`,
                  `- Runtime version (Android): \`${short(androidRv)}\` (full: \`${androidRv}\`)`,
                  `- Board field: enter the 8-character form above`,
                  `- Commit: ${context.sha.slice(0, 7)}`,
                  `- Rollback: \`eas update:republish --group <previous group id> --destination-branch production\``,
                ].join('\n'),
              });
            }
