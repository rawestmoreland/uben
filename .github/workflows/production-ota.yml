name: Production - OTA

# Manual OTA (JS-only update) to the production channel. Run it from main.
# Store releases live in production.yml.
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update description'
        required: true
        type: string
      skip_build_check:
        description: 'Skip the EAS build lookup (for builds uploaded without runtime metadata)'
        required: false
        default: false
        type: boolean
      issue:
        description: 'Tracking issue number to comment on (optional)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: production-ota
  cancel-in-progress: false

jobs:
  ota:
    name: Publish OTA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # An OTA only reaches builds with the same runtime version. This needs
      # runtimeVersion.policy = 'fingerprint' in app.config.js; with 'appVersion' the
      # build's runtime version is "1.9.1", which can never equal a fingerprint hash.
      - name: Verify OTA compatibility
        id: verify
        env:
          SKIP_BUILD_CHECK: ${{ inputs.skip_build_check }}
        run: |
          # Generate fingerprints with eas-cli, not `expo-updates fingerprint:generate`: eas-cli
          # resolves the same build profile env and EAS "production" environment variables the
          # builder uses, which feed into app.config.js. A bare local run produces a different
          # hash than the builder, so it would never match the store builds. (staging.yml does
          # the same.)

          # Print the fingerprint hash from `eas fingerprint:generate --json`. eas-cli can
          # write status lines (e.g. "Environment variables ... loaded from ...") to stdout
          # ahead of the JSON when run in CI, which breaks a plain `jq`. Keep everything
          # from the first line that starts the JSON document, and show the raw output if
          # no hash can be read so the real cause is visible in the log.
          fingerprint_hash() {
            local raw hash
            raw=$("$@") || true
            hash=$(printf '%s\n' "$raw" | sed -n '/^[[{]/,$p' | jq -r '.hash // empty' 2>/dev/null) || hash=""
            if [ -z "$hash" ]; then
              echo "::warning::could not read a fingerprint hash from: $*. Output: $raw" >&2
            fi
            printf '%s' "$hash"
          }

          CURRENT_IOS=$(fingerprint_hash eas fingerprint:generate --build-profile production --platform ios --json --non-interactive)
          CURRENT_ANDROID=$(fingerprint_hash eas fingerprint:generate --build-profile production --platform android --json --non-interactive)
          echo "iOS fingerprint:     $CURRENT_IOS"
          echo "Android fingerprint: $CURRENT_ANDROID"
          echo "ios_fingerprint=$CURRENT_IOS" >> "$GITHUB_OUTPUT"
          echo "android_fingerprint=$CURRENT_ANDROID" >> "$GITHUB_OUTPUT"

          if [ -z "$CURRENT_IOS" ] || [ -z "$CURRENT_ANDROID" ]; then
            echo "::error::Could not generate the native fingerprints."
            exit 1
          fi

          # `eas update` doesn't apply the build profile's `env` block, but it does load the
          # server-side EAS "production" environment via `--environment`; APP_ENV must be
          # defined there. Abort now, before publishing, if an update run that way would get a
          # different runtime version than the builds we just verified.
          UPDATE_IOS=$(fingerprint_hash eas fingerprint:generate --environment production --platform ios --json --non-interactive)
          UPDATE_ANDROID=$(fingerprint_hash eas fingerprint:generate --environment production --platform android --json --non-interactive)
          echo "iOS update fingerprint:     $UPDATE_IOS"
          echo "Android update fingerprint: $UPDATE_ANDROID"
          if [ "$UPDATE_IOS" != "$CURRENT_IOS" ] || [ "$UPDATE_ANDROID" != "$CURRENT_ANDROID" ]; then
            echo "::error::The update would be published with a different runtime version than the production build profile (iOS $UPDATE_IOS vs $CURRENT_IOS, Android $UPDATE_ANDROID vs $CURRENT_ANDROID). No device would receive it."
            exit 1
          fi

          if [ "$SKIP_BUILD_CHECK" = "true" ]; then
            echo "::warning::Skipping the EAS build lookup. Make sure the fingerprints above match the production binaries' runtime versions, or users will not receive this update."
            exit 0
          fi

          # The update is only delivered to builds with the same runtime version, so look for a
          # finished production-channel build with exactly the current fingerprint.
          check_platform() {
            local platform="$1" current="$2" builds
            if ! builds=$(eas build:list --channel production --platform "$platform" --status finished --runtime-version "$current" --limit 1 --non-interactive --json); then
              echo "::error::eas build:list failed for $platform (see output above)."
              return 1
            fi
            if [ "$(echo "$builds" | jq 'length')" -eq 0 ]; then
              echo "::error::No finished $platform build on the production channel has runtime version $current. Either the native fingerprint changed since the last store build (do a full store release), the build was uploaded without channel/runtime metadata (re-run with skip_build_check after confirming the binary's runtime version), or the project is not using runtimeVersion.policy 'fingerprint'."
              return 1
            fi
            echo "$platform: found a finished build with runtime version $current"
          }

          status=0
          check_platform ios "$CURRENT_IOS" || status=1
          check_platform android "$CURRENT_ANDROID" || status=1
          if [ "$status" -ne 0 ]; then exit 1; fi
          echo "Fingerprints match - OTA update is safe to publish"

      - name: Publish OTA update
        id: ota
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
          EXPECTED_IOS_RV: ${{ steps.verify.outputs.ios_fingerprint }}
          EXPECTED_ANDROID_RV: ${{ steps.verify.outputs.android_fingerprint }}
        run: |
          # Publish each platform separately: `--platform all` also exports a web
          # bundle, which this native-only app can't build. Each platform gets its
          # own update group.
          # `--environment production` loads the EAS "production" variables (incl. APP_ENV)
          # so the update sees the same config as the store builds; without it `eas update`
          # computes a different runtime version and reaches no one.
          publish() {
            eas update --branch production --environment production --message "${UPDATE_MESSAGE} (${GITHUB_SHA::7})" --non-interactive --platform "$1" --json
          }
          IOS_OUTPUT=$(publish ios)
          echo "$IOS_OUTPUT"
          ANDROID_OUTPUT=$(publish android)
          echo "$ANDROID_OUTPUT"
          # Last line of defense: the update must carry the runtime version of the verified builds
          IOS_RV=$(echo "$IOS_OUTPUT" | jq -r '.[0].runtimeVersion // "n/a"')
          ANDROID_RV=$(echo "$ANDROID_OUTPUT" | jq -r '.[0].runtimeVersion // "n/a"')
          if [ "$IOS_RV" != "$EXPECTED_IOS_RV" ] || [ "$ANDROID_RV" != "$EXPECTED_ANDROID_RV" ]; then
            echo "::error::Published runtime versions (iOS $IOS_RV, Android $ANDROID_RV) differ from the verified builds (iOS $EXPECTED_IOS_RV, Android $EXPECTED_ANDROID_RV). These updates will not reach production devices; delete them from the production branch in the EAS dashboard."
            exit 1
          fi
          # iOS and Android fingerprints differ, so record both
          echo "ios_group_id=$(echo "$IOS_OUTPUT" | jq -r '.[0].group')" >> "$GITHUB_OUTPUT"
          echo "android_group_id=$(echo "$ANDROID_OUTPUT" | jq -r '.[0].group')" >> "$GITHUB_OUTPUT"
          echo "ios_runtime_version=$(echo "$IOS_OUTPUT" | jq -r '.[0].runtimeVersion // "n/a"')" >> "$GITHUB_OUTPUT"
          echo "android_runtime_version=$(echo "$ANDROID_OUTPUT" | jq -r '.[0].runtimeVersion // "n/a"')" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        uses: actions/github-script@v7
        env:
          UPDATE_MESSAGE: ${{ inputs.message }}
          IOS_GROUP_ID: ${{ steps.ota.outputs.ios_group_id }}
          ANDROID_GROUP_ID: ${{ steps.ota.outputs.android_group_id }}
          IOS_RUNTIME_VERSION: ${{ steps.ota.outputs.ios_runtime_version }}
          ANDROID_RUNTIME_VERSION: ${{ steps.ota.outputs.android_runtime_version }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        with:
          script: |
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;
            const version = execSync('node scripts/app-version.cjs').toString().trim();
            const message = process.env.UPDATE_MESSAGE;
            const iosGroupId = process.env.IOS_GROUP_ID;
            const androidGroupId = process.env.ANDROID_GROUP_ID;
            const iosRv = process.env.IOS_RUNTIME_VERSION;
            const androidRv = process.env.ANDROID_RUNTIME_VERSION;
            // Short form (first 8 chars) is what goes in the project board's Runtime version field
            const short = (rv) => (rv && rv !== 'n/a' ? rv.slice(0, 8) : rv);
            const dashboardUrl = (groupId) => `https://expo.dev/accounts/rawestmoreland/projects/uben/updates/${groupId}`;

            // Unique per run: the app version doesn't change between OTAs
            const tag = `v${version}-ota.${process.env.GITHUB_RUN_NUMBER}`;

            await github.rest.git.createRef({
              owner, repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `v${version} OTA`,
              body: `## Production OTA\n\n${message}\n\nEAS update groups: iOS [\`${iosGroupId}\`](${dashboardUrl(iosGroupId)}), Android [\`${androidGroupId}\`](${dashboardUrl(androidGroupId)})\n\nRuntime version: iOS \`${iosRv}\`, Android \`${androidRv}\`\n\nDelivered over the air. No store update is required.`,
              draft: false,
              prerelease: true,
            });

            // Report back to the tracking issue so the release board reflects the OTA
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: issueNumber,
                body: [
                  `OTA published to \`production\` (${tag}).`,
                  '',
                  `- Update group (iOS): [\`${iosGroupId}\`](${dashboardUrl(iosGroupId)})`,
                  `- Update group (Android): [\`${androidGroupId}\`](${dashboardUrl(androidGroupId)})`,
                  `- Runtime version (iOS): \`${short(iosRv)}\` (full: \`${iosRv}\`)`,
                  `- Runtime version (Android): \`${short(androidRv)}\` (full: \`${androidRv}\`)`,
                  `- Board field: enter the 8-character form above`,
                  `- Commit: ${context.sha.slice(0, 7)}`,
                  `- Rollback: \`eas update:republish --group <previous group id> --destination-branch production\``,
                ].join('\n'),
              });
            }
