name: Production - OTA Hotfix

# Manual OTA hotfix to the production channel. Run it from main.
# Store releases live in production.yml.
on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Hotfix description'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    name: OTA Hotfix
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      # An OTA only reaches builds with the same runtime version. This needs
      # runtimeVersion.policy = 'fingerprint' in app.config.js; with 'appVersion' the
      # build's runtime version is "1.9.1", which can never equal a fingerprint hash.
      - name: Verify OTA compatibility
        run: |
          CURRENT_IOS=$(npx expo-updates fingerprint:generate --platform ios 2>/dev/null | jq -r '.hash')
          CURRENT_ANDROID=$(npx expo-updates fingerprint:generate --platform android 2>/dev/null | jq -r '.hash')
          LATEST_IOS_RV=$(eas build:list --channel production --platform ios --status finished --limit 1 --non-interactive --json 2>/dev/null | jq -r '.[0].runtimeVersion // empty')
          LATEST_ANDROID_RV=$(eas build:list --channel production --platform android --status finished --limit 1 --non-interactive --json 2>/dev/null | jq -r '.[0].runtimeVersion // empty')
          echo "iOS:     current=$CURRENT_IOS latest-build=$LATEST_IOS_RV"
          echo "Android: current=$CURRENT_ANDROID latest-build=$LATEST_ANDROID_RV"

          if [ -z "$CURRENT_IOS" ] || [ -z "$CURRENT_ANDROID" ] || [ -z "$LATEST_IOS_RV" ] || [ -z "$LATEST_ANDROID_RV" ]; then
            echo "::error::Could not read fingerprints or the latest production builds' runtime versions."
            exit 1
          fi

          # A semver-looking runtime version means the project still uses the appVersion policy
          if echo "$LATEST_IOS_RV $LATEST_ANDROID_RV" | grep -Eq '(^| )[0-9]+\.[0-9]+'; then
            echo "::error::Latest production builds use an app-version runtime version. Switch runtimeVersion.policy to 'fingerprint' and ship a store release before using OTA hotfixes."
            exit 1
          fi

          if [ "$CURRENT_IOS" != "$LATEST_IOS_RV" ] || [ "$CURRENT_ANDROID" != "$LATEST_ANDROID_RV" ]; then
            echo "::error::Native fingerprint changed since the last production build. An OTA would not reach users; do a full store release instead."
            exit 1
          fi
          echo "Fingerprints match - OTA hotfix is safe to publish"

      - name: Publish OTA hotfix
        id: ota
        env:
          HOTFIX_MESSAGE: ${{ inputs.message }}
        run: |
          OUTPUT=$(eas update --branch production --message "Hotfix: ${HOTFIX_MESSAGE} (${GITHUB_SHA::7})" --non-interactive --platform all --json)
          echo "$OUTPUT"
          GROUP_ID=$(echo "$OUTPUT" | jq -r '.[0].group')
          echo "group_id=$GROUP_ID" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        uses: actions/github-script@v7
        env:
          HOTFIX_MESSAGE: ${{ inputs.message }}
          UPDATE_GROUP_ID: ${{ steps.ota.outputs.group_id }}
        with:
          script: |
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;
            const version = execSync('node scripts/app-version.cjs').toString().trim();
            const message = process.env.HOTFIX_MESSAGE;
            const groupId = process.env.UPDATE_GROUP_ID;

            // Unique per run: the app version doesn't change between OTAs
            const tag = `v${version}-hotfix.${process.env.GITHUB_RUN_NUMBER}`;

            await github.rest.git.createRef({
              owner, repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha,
            });

            await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `v${version} Hotfix`,
              body: `## Production OTA Hotfix\n\n${message}\n\nEAS update group: \`${groupId}\`\n\nDelivered over the air. No store update is required.`,
              draft: false,
              prerelease: true,
            });
