name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: write

jobs:
  validate-pr-direction:
    name: Validate PR Direction
    runs-on: ubuntu-latest
    steps:
      - name: Check PR direction
        uses: actions/github-script@v7
        with:
          script: |
            const { base, head } = context.payload.pull_request;
            const baseBranch = base.ref;
            const headBranch = head.ref;

            console.log(`PR: ${headBranch} → ${baseBranch}`);

            // Validate PR direction
            if (baseBranch === 'staging' && headBranch !== 'develop') {
              core.setFailed(`❌ Staging can only accept PRs from develop branch. Got: ${headBranch}`);
              return;
            }

            if (baseBranch === 'main' && headBranch !== 'staging') {
              core.setFailed(`❌ Main can only accept PRs from staging branch. Got: ${headBranch}`);
              return;
            }

            console.log('✅ PR direction is valid');

  lint-and-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    needs: validate-pr-direction
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        run: |
          npm run lint 2>&1 | tee lint-output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code
        continue-on-error: true

      - name: Run TypeScript check
        id: tsc
        run: |
          npx tsc --noEmit 2>&1 | tee tsc-output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code
        continue-on-error: true

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lintOutput = fs.existsSync('lint-output.txt') ? fs.readFileSync('lint-output.txt', 'utf8') : '';
            const tscOutput = fs.existsSync('tsc-output.txt') ? fs.readFileSync('tsc-output.txt', 'utf8') : '';

            const lintSuccess = '${{ steps.lint.outputs.exit_code }}' === '0';
            const tscSuccess = '${{ steps.tsc.outputs.exit_code }}' === '0';

            let body = '## Code Quality Checks\n\n';

            body += `### Lint ${lintSuccess ? '✅' : '❌'}\n`;
            if (!lintSuccess && lintOutput) {
              body += '```\n' + lintOutput.slice(0, 2000) + '\n```\n\n';
            }

            body += `### TypeScript ${tscSuccess ? '✅' : '❌'}\n`;
            if (!tscSuccess && tscOutput) {
              body += '```\n' + tscOutput.slice(0, 2000) + '\n```\n\n';
            }

            if (lintSuccess && tscSuccess) {
              body += '\n✅ All checks passed!';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            if (!lintSuccess || !tscSuccess) {
              core.setFailed('Code quality checks failed');
            }
